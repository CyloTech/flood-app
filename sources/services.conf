[program:rtorrent]
command=/scripts/rtorrent-run.sh -D -n -o import=/torrents/config/rtorrent/.rtorrent.rc -o system.daemon.set=true
user=flood
environment=HOME="/home/flood",TERM="xterm"
priority=10
autostart=true
autorestart=true
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:flood]
command=/usr/local/bin/flood --host 127.0.0.1 --port 3000 --rundir /home/flood/.local/ --auth default --allowedpath /torrents
user=flood
environment=HOME="/home/flood"
priority=20
autostart=true
autorestart=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx
priority=30
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rtcheck]
command=/scripts/rtcheck.py
user=flood
priority=40
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:callback]
command=/scripts/callback.py
priority=50
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
